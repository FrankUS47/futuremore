<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八字命理與紫微斗數專業排盤分析系統</title>
<style>
:root{--bg:#f4efe6;--card:#fdfbf7;--primary:#8c2a2a;--secondary:#1d3557;--accent:#c89b51;--text:#2b2b2b;--border:#dcd3c1;--th:#f4ede2}
*{box-sizing:border-box}
body{font-family:"PingFang TC","Microsoft JhengHei","Noto Serif CJK TC",serif;background:var(--bg);color:var(--text);margin:0;padding:20px;display:flex;justify-content:center}
.container{max-width:1100px;width:100%;background:var(--card);border:2px solid var(--accent);border-radius:8px;padding:30px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
header{text-align:center;border-bottom:2px solid var(--primary);padding-bottom:15px;margin-bottom:25px}
h1{color:var(--primary);margin:0 0 8px;font-size:1.8rem;letter-spacing:2px}
.subtitle{color:#666;font-size:.95rem}
.input-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px;background:#f8f4ec;padding:20px;border:1px solid var(--border);border-radius:6px;margin-bottom:25px}
.form-group{display:flex;flex-direction:column}
.form-group label{font-size:.9rem;font-weight:bold;color:var(--primary);margin-bottom:5px}
.form-group input,.form-group select{padding:8px 12px;border:1px solid var(--border);border-radius:4px;font-size:.95rem;background:#fff;font-family:inherit}
.form-group.check label{display:flex;gap:6px;align-items:center}.form-group.check input{width:auto}
.form-group small{color:#777;font-size:.8rem;margin-top:4px;line-height:1.4}
.custom-box{display:flex;gap:6px;margin-top:6px}.custom-box input{flex:1;min-width:0}
.controls{text-align:center;margin-bottom:25px}
.btn{background:var(--primary);color:#fff;border:none;padding:12px 36px;font-size:1.15rem;font-family:inherit;border-radius:4px;cursor:pointer}
.btn:hover{background:#6e2020}
.err{background:#fdecea;color:#b71c1c;border:1px solid #e57373;border-radius:4px;padding:10px 14px;margin-bottom:15px}
.sec-title{color:var(--primary);text-align:center;font-size:1.4rem;margin:26px 0 14px}
.sec-title small{font-size:.85rem;color:#777;font-weight:normal}
.summary{background:#fff;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:4px;padding:12px 16px;margin-bottom:16px;line-height:1.9;font-size:.95rem}
.summary small{color:#777}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);margin:10px 0 18px;font-size:.92rem}
.tbl th,.tbl td{border:1px solid var(--border);padding:8px;text-align:center;vertical-align:middle}
.tbl th{background:var(--th);color:var(--primary);font-weight:bold}
.tbl td.left{text-align:left}.tbl.small{font-size:.85rem}
.tbl td.gz{font-size:1.5rem;font-weight:bold}.tbl td.gz small{font-size:.7rem;font-weight:normal;margin-left:2px;color:#777}
.tbl tr.cur td{background:#fff6dc}
.kw{display:block;font-size:.7rem;color:#999}
.el{font-weight:bold}.el-木{color:#2e7d32}.el-火{color:#c62828}.el-土{color:#8d6e00}.el-金{color:#8a8a8a}.el-水{color:#1565c0}
.el-bg-木{background:#2e7d32}.el-bg-火{background:#c62828}.el-bg-土{background:#b8860b}.el-bg-金{background:#9e9e9e}.el-bg-水{background:#1565c0}
.card{background:#fff;border:1px solid var(--border);border-radius:5px;padding:18px;margin-bottom:18px;line-height:1.8;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.card h3{margin:0 0 10px;color:var(--secondary);font-size:1.15rem;border-left:4px solid var(--secondary);padding-left:10px}
.card h4{margin:12px 0 6px;color:var(--primary)}
.card ul{padding-left:20px;margin:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.bar-row{display:flex;align-items:center;margin-bottom:6px;font-size:.9rem}
.bar-label{width:110px}.bar-label small{color:#777}
.bar-bg{flex:1;background:#eee;height:16px;border-radius:8px;overflow:hidden;margin:0 8px}
.bar-fill{height:100%}.bar-val{width:42px;text-align:right;font-weight:bold}
.badge{display:inline-block;background:var(--primary);color:#fff;padding:1px 8px;border-radius:3px;font-size:.82rem}
.b-good{background:#2e7d32}.b-bad{background:#c62828}.b-neutral{background:#f57c00}
.quote{background:#f7f3eb;border-left:4px solid var(--accent);padding:10px 14px;margin:10px 0}
.note{color:#777;font-size:.85rem}
/* 紫微命盤 */
.zgrid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,minmax(190px,auto));gap:0;border:2px solid #9c3fa0;background:#fff;margin-bottom:18px}
.zcell{border:1px solid #c9a6cc;background:#fbf0fb;padding:5px 6px;display:flex;flex-direction:column;font-size:.85rem;min-width:0}
.zcell.is-life{background:#f6e3f7}.zcell.cur-dx{box-shadow:inset 0 0 0 2px #e6a100}
.z-stars{flex:1}.z-main{display:flex;flex-wrap:wrap;gap:2px 8px}
.s-main{font-weight:bold;color:#b3002d;font-size:1rem;white-space:nowrap}
.s-good{color:#1d3557;white-space:nowrap}.s-bad{color:#555;white-space:nowrap}.s-misc{color:#7a5a7e;font-size:.78rem;white-space:nowrap}
.z-minor{display:flex;flex-wrap:wrap;gap:1px 8px;margin-top:3px}
.zcell i{font-style:normal;font-size:.7rem;color:#2e7d32;margin-left:1px}
.hua{font-size:.7rem;margin-left:2px;padding:0 3px;border-radius:2px;color:#fff}
.hua-祿{background:#2e7d32}.hua-權{background:#1565c0}.hua-科{background:#ef6c00}.hua-忌{background:#c62828}
.z-mid{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:#6a4a6e;margin:4px 0}
.z-cs{color:#b8860b}.z-dx{font-weight:bold;color:#222}
.flow{font-style:normal;font-size:.68rem;background:#e6a100;color:#fff;border-radius:2px;padding:0 3px;margin-left:2px}
.z-low{display:flex;justify-content:space-between;align-items:flex-end}
.z-small{font-size:.68rem;color:#777;line-height:1.35}
.z-name{text-align:right}.z-name b{background:#c26bc7;color:#fff;padding:1px 6px;border-radius:2px;font-size:.85rem}
.z-name small{color:#6a4a6e}.tag{font-style:normal;background:#8c2a2a;color:#fff;font-size:.68rem;border-radius:2px;padding:0 3px;margin-right:3px}
.zcenter{grid-row:2/4;grid-column:2/4;background:#fff;padding:10px 14px;border:1px solid #c9a6cc;overflow:auto}
.zcenter h4{margin:0 0 6px;color:#7b2d83;text-align:center}
.zinfo{width:100%;border-collapse:collapse;font-size:.85rem}.zinfo th{width:92px;text-align:left;color:#7b2d83;padding:3px 4px;vertical-align:top}.zinfo td{padding:3px 4px;border-bottom:1px dotted #e3cfe5}
@media(max-width:760px){.zgrid{grid-template-columns:repeat(2,1fr);grid-template-rows:none}.zcell,.zcenter{grid-row:auto!important;grid-column:auto!important}.zcenter{grid-column:1/3!important;order:-1}}
@media print{body{background:#fff;padding:0}.container{border:none;box-shadow:none}.input-grid,.controls{display:none}}

.dsel{display:flex;gap:4px}.dsel select{padding:8px 4px;border:1px solid var(--border);border-radius:4px;font-family:inherit;background:#fff;min-width:0}.dsel .dy{flex:2.4}.dsel .dm,.dsel .dd{flex:1}
.form-group.wide{grid-column:span 2}
@media(max-width:520px){.form-group.wide{grid-column:span 1}}
.dsel .dy{flex:0 0 52%}.dsel select{font-size:.9rem}
.sum-head{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.sum-head>div{flex:1;min-width:220px;background:#f7f3eb;border-left:4px solid var(--accent);padding:10px 14px;display:flex;flex-direction:column}
.sum-head b{font-size:1.8rem;color:var(--primary)}.sum-head small{color:#777}.sum-head span{font-size:.85rem}
.sbar{position:relative;background:#eee;height:18px;border-radius:9px;overflow:hidden;margin-bottom:2px}
.sbar-fill{height:100%}.sbar span{position:absolute;right:8px;top:0;font-size:.75rem;line-height:18px;font-weight:bold;color:#222}
.sb-good{background:#8bc48d}.sb-neutral{background:#f5c27a}.sb-bad{background:#e59a9a}
.sum-head .badge{align-self:flex-start;margin-top:4px}
.gender-cmt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gender-cmt>div{padding:10px 12px;border:1px solid var(--border);border-radius:4px;background:#faf8f3}.gender-cmt>div.me{background:#fff6dc;border-color:var(--accent)}@media(max-width:760px){.gender-cmt{grid-template-columns:1fr}}
.tier-note{color:#555;font-size:.9rem;margin:8px 0 0}
.bone-blk{display:flex;gap:12px;padding:8px 0;border-bottom:1px dotted var(--border)}.bone-blk>span{flex:0 0 72px;color:var(--primary);font-weight:bold}.bone-blk>div{flex:1}
.flow-form{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}.flow-form .form-group{min-width:150px}.flow-form input[type=time]{padding:8px 12px;border:1px solid var(--border);border-radius:4px}.btn.small{padding:8px 24px;font-size:1rem}.rel{display:inline-block;padding:0 4px;border-radius:2px}.rel-沖{background:#fde0dc;color:#b71c1c}.rel-刑{background:#fff0d9;color:#a65d00}.rel-害{background:#f3e5f5;color:#6a1b9a}.rel-合{background:#e0f2e9;color:#1b5e20}
.zwrap{margin-bottom:18px}.zwrap .zgrid{margin-bottom:0}

</style>
</head>
<body>
<div class="container">
  <header>
    <h1>八字命理與紫微斗數專業排盤系統</h1>
    <div class="subtitle">八字為主・紫微為輔</div>
  </header>

  <div class="input-grid">
    <div class="form-group"><label for="userName">1. 姓名 / 稱呼</label><input type="text" id="userName" value="命主"></div>
    <div class="form-group"><label for="gender">2. 性別</label>
      <select id="gender"><option value="男">男</option><option value="女">女</option></select></div>
    <div class="form-group wide"><label for="birthDate">3. 出生日期 (陽曆/國曆)</label><div class="dsel" id="birthDate"></div></div>
    <div class="form-group"><label for="birthTime">4. 出生時辰</label>
      <select id="birthTime">
        <option value="00:30">子時（00:00～01:00 早子）</option>
        <option value="02:00">丑時（01:00～03:00）</option>
        <option value="04:00">寅時（03:00～05:00）</option>
        <option value="06:00">卯時（05:00～07:00）</option>
        <option value="08:00">辰時（07:00～09:00）</option>
        <option value="10:00">巳時（09:00～11:00）</option>
        <option value="12:00">午時（11:00～13:00）</option>
        <option value="14:00">未時（13:00～15:00）</option>
        <option value="16:00">申時（15:00～17:00）</option>
        <option value="18:00">酉時（17:00～19:00）</option>
        <option value="20:00" selected>戌時（19:00～21:00）</option>
        <option value="22:00">亥時（21:00～23:00）</option>
        <option value="23:30">子時（23:00～24:00 晚子）</option>
      </select></div>
    <div class="form-group"><label for="birthPlace">5. 出生地點</label><select id="birthPlace"></select>
      <div id="customBox" class="custom-box" style="display:none">
        <input type="number" id="customLon" step="0.01" placeholder="東經(西經填負值)">
        <input type="number" id="customTz" step="0.5" placeholder="時區(如 8)" value="8"></div></div>
    <div class="form-group"><label for="queryTopic">6. 占問主題焦點</label>
      <select id="queryTopic">
        <option value="general">整體格局 / 大運流年 / 綜合決策</option>
        <option value="career">事業發展 / 升遷轉職 / 官運功名</option>
        <option value="wealth">財務狀況 / 投資理財 / 財源聚散</option>
        <option value="love">感情婚姻 / 擇偶配對 / 人際關係</option>
        <option value="health">身體健康 / 疾病預警 / 臟腑調理</option>
      </select></div>
    <div class="form-group wide"><label for="refDate">7. 排盤日期 (流年大運依此計算)</label><div class="dsel" id="refDate"></div></div>
    <div class="form-group"><label for="zishi">8. 晚子時 (23:00-23:59) 日柱</label>
      <select id="zishi"><option value="next">算次日（早晚子時分界，通行）</option><option value="same">算當日（不換日）</option></select></div>
    <div class="form-group check"><label><input type="checkbox" id="useTST"> 依出生地經度校正真太陽時</label>
      <small>預設不校正。因只填時辰，勾選後以該時辰中點時間換算，僅在接近時辰邊界時才可能改變時柱。</small></div>
  </div>

  <div class="controls"><button class="btn" id="genBtn">排盤並生成分析報告</button></div>
  <div id="errBox" class="err" style="display:none"></div>
  <div id="result" style="display:none"></div>
</div>
<script>
/* ============================================================
 * 模組一：天文計算（太陽黃經、十二節時刻）
 *   以太陽視黃經演算法推算節氣，再以逐年校正表(分鐘)修正至 ±1 分鐘
 * ============================================================ */
const Astro = (function () {
    const RAD = Math.PI / 180;
    const TERM_LON = [285, 315, 345, 15, 45, 75, 105, 135, 165, 195, 225, 255]; // 小寒~大雪
    const TERM_NAME = ["小寒", "立春", "驚蟄", "清明", "立夏", "芒種", "小暑", "立秋", "白露", "寒露", "立冬", "大雪"];
    const FIX_START = 1899;
    const FIX_TABLE = "jjkkjihijkjigeeffghknomjfcdhloqrrrrpmkjjjhfddfjmmljhfefgilnoomkjiikmnonmmmnnmkihhhhghjmpqqnllmnoonnmmkighkmonljihiijjjjihhhjmprrpnlklnoonkhedddegijjhfefikkhfdeghjkmopoliffhjjhffgggfefgikkjjknppnkhfefghkmopomjfdegijjiijlnoooopppooqsusoiedfhklmnonlifgikkkiikmpqqpnmmlllnpqoliecbdgjlnoppomkjiiiiiijmopolifeeffgjmnmiebbdhkmoqssromkjigecdgknoolhebabehkllljhgghknoonnoqqqnifdeeegjnpqokhghkllllmmmkjjkmonmllmmlkigfeefgjmqssrolkkmoppomkjiihijkljhgiklkhdbbdgjmpsusplihjmnljijjjihgghiihijmoolifddfiloqssrplhffgijihhijkkkjkmoonnprsrnieegknopppnjfccegihgghjlnnnnmmmmnprrplheccehlnnmlkihgffffghijmoqpnkihijkklmlkhdbbehlnnoqqpnmkkjjjiiknqsrplifefhijjjjihhhjmqrrpooqssqnkiiiijlorrokhghklljiijjjklnpqpomlmnnmkhgffghjlnoonljiijlmlkjjjkkkklmmkiggijjgcaabdgilprrplhhjlnmjijklllkkjihfefilmkhecceiloprrrqpmlkkkkjihjmopnmllmmllmoqqoliiknprrrrqolihhihhgghjloppomlkkmorssqnkihiknppnlkjihgecccdegkpstqmjhijklmnonlhfefhijjklnnnljhgfffhkosuusokgeeghijjkkjhggilnnmmnpstrnkiijlmosuurmheegijihiijjklmnooonnprtrolighilnprrqoliggikllllmnonnmmnonmlmnonjfcbdgiknqsspkgfhkmnnmnopponmmljihikmnliebacglpqqqpomlkklmnnllmorroljjjkkllmnmjgffjmqrsrrqpmjiiijjjjjklmmlkjihikmpqpomjhhjlprsqoljihfeccddefjnqqnjgfgjmopqqqnliijmnnnmmmnmmjhfeegilpsuutqmjjkmnnnmmnnljjkmnnmklnprqnlklnopqsvvtpkhhjkkihhhhhijlmnmlkkmoqrpmkjjkmoqrqpnkhfghjjigfgjmnmlllmlkkloppmjgfgijjkmoonkhghjkkjjkmpqrrqpnmkiikmnnmjgdegjmnnnnnnnnooppommnquwvspmllllmnonlihhknpqpppqqqpponmmllmoqqrqnlihijlnoonnlkjjloqrqpooonligfffefimpqnjfcceilnoqqpnlkkmoonmmnopomiebabeimprsqnkhhjmoooopqqpnkklmmlklnqqokgfhjmnpsvwuqmjikmnmllmlkkjjjjjjjkmprsqnkiiknruvwvsolihiklkihikmnmkiijjklosuuqmighknopqrrpmjhhiiihiknprrqomlkklmoqqqolhfefjmnnmmnmllkklmnmmnquvvspmlmnopppolheegjmoonmmmnnnnmllmnoqstsqnkihjloonlkjihghjmpqpooopomjhhijkjlnppnjgeegkmnoppomkkmorssqpprsrqmjgffikmoqqpnkiilprrpooprsrrqrsrqnnprrokhfhjlmnoqrqomlmopponmmmmlllllkkjijlmnmkiggilorsttrpmlklmmliggiklljihggghkorrplihilnpqqrsrpnmlkjhfefiloppoljijkmnpqqqomkjjmoonmmnoonlkjkkjjkosvwuspoopqqqrqplihikmnnnmlmnooonlkjkmpsvwvspmkknppomkjjihhijllkklnpqokgffgijlorsqmiffghiiijklkjijklnnnnoqstrokgeegilnpqqojgegjmmlklnqrrqqqqqpopruvsmhedfikmopqpnkjjklllllnpqqponlkkklnopomjfdceilprsttrolkkkllkkkmppoligfffhjnqqojfdehmprtuvusqomljhgfgilopomifdehkmnoonmkiiknpqqooopomjgffghhilorrpmkklnppppomkihikmnonmkjjjjihgfghkmprttqnlkloqrpmkihgffhjlljhhjmnlhedehjmoqttsokiijmmkjijjjjjjklmnnnnprrqnkihiknpqrrrpmighkmmkjijmopppqrrqpprttsnifgilnoppoljgfgijiihhikmoponmllmnoponkhdbbdhkmmmmnmkjhghiiiijmpqp";

    function deltaT(y) {
        let t;
        if (y < 1900) return 0;
        if (y < 1920) { t = y - 1900; return -2.79 + 1.494119 * t - 0.0598939 * t * t + 0.0061966 * t ** 3 - 0.000197 * t ** 4; }
        if (y < 1941) { t = y - 1920; return 21.20 + 0.84493 * t - 0.076100 * t * t + 0.0020936 * t ** 3; }
        if (y < 1961) { t = y - 1950; return 29.07 + 0.407 * t - t * t / 233 + t ** 3 / 2547; }
        if (y < 1986) { t = y - 1975; return 45.45 + 1.067 * t - t * t / 260 - t ** 3 / 718; }
        if (y < 2005) { t = y - 2000; return 63.86 + 0.3345 * t - 0.060374 * t * t + 0.0017275 * t ** 3 + 0.000651814 * t ** 4 + 0.00002373599 * t ** 5; }
        t = y - 2000; return 62.92 + 0.32217 * t + 0.005589 * t * t;
    }
    const jdFromMs = ms => ms / 86400000 + 2440587.5;
    const msFromJd = jd => (jd - 2440587.5) * 86400000;

    // 太陽視黃經（度）；輸入為 UT 儒略日
    function sunLongitude(jdUT) {
        const yr = 2000 + (jdUT - 2451545) / 365.25;
        const T = (jdUT + deltaT(yr) / 86400 - 2451545) / 36525;
        const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
        const M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * RAD;
        const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M)
                + (0.019993 - 0.000101 * T) * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
        const omega = (125.04 - 1934.136 * T) * RAD;
        const lon = L0 + C - 0.00569 - 0.00478 * Math.sin(omega);
        return ((lon % 360) + 360) % 360;
    }
    const wrap180 = d => ((d + 540) % 360) - 180;

    // 民用年 year 內第 idx 個「節」(0=小寒 … 11=大雪) 的 UTC 毫秒
    function termMs(year, idx) {
        const L = TERM_LON[idx];
        const rel = L >= 285 ? L - 360 : L;
        let jd = jdFromMs(Date.UTC(year, 2, 20, 12)) + rel / 360 * 365.2422;
        for (let i = 0; i < 10; i++) {
            const diff = wrap180(L - sunLongitude(jd));
            jd += diff / 0.9856474;
            if (Math.abs(diff) < 1e-8) break;
        }
        let ms = msFromJd(jd);
        const k = year - FIX_START;
        if (k >= 0 && k * 12 + idx < FIX_TABLE.length) ms += (parseInt(FIX_TABLE[k * 12 + idx], 36) - 18) * 60000;
        return ms;
    }
    // 取得 ms 前後最近的「節」
    function nearestTerms(ms) {
        const y = new Date(ms).getUTCFullYear();
        const list = [];
        for (let yy = y - 1; yy <= y + 1; yy++) for (let i = 0; i < 12; i++) list.push({ ms: termMs(yy, i), name: TERM_NAME[i], year: yy, idx: i });
        list.sort((a, b) => a.ms - b.ms);
        let prev = list[0], next = list[list.length - 1];
        for (const t of list) { if (t.ms <= ms) prev = t; else { next = t; break; } }
        return { prev, next };
    }
    return { sunLongitude, termMs, nearestTerms, jdFromMs, TERM_NAME, TERM_LON };
})();

/* ============================================================
 * 模組二：基礎資料表（天干地支、五行、藏干、納音、十神…）
 * ============================================================ */
const Data = (function () {
    const STEMS = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
    const BRANCHES = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
    const ZODIAC = ["鼠", "牛", "虎", "兔", "龍", "蛇", "馬", "羊", "猴", "雞", "狗", "豬"];
    const STEM_ELEM = ["木", "木", "火", "火", "土", "土", "金", "金", "水", "水"];
    const BRANCH_ELEM = ["水", "土", "木", "木", "土", "火", "火", "土", "金", "金", "土", "水"];
    const ELEMS = ["木", "火", "土", "金", "水"];
    const GEN = { 木: "火", 火: "土", 土: "金", 金: "水", 水: "木" };   // 相生
    const OVER = { 木: "土", 土: "水", 水: "火", 火: "金", 金: "木" };  // 相剋

    // 地支藏干 [天干, 權重%]（本氣、中氣、餘氣）
    const HIDDEN = [
        [["癸", 100]],
        [["己", 60], ["癸", 30], ["辛", 10]],
        [["甲", 60], ["丙", 30], ["戊", 10]],
        [["乙", 100]],
        [["戊", 60], ["乙", 30], ["癸", 10]],
        [["丙", 60], ["戊", 30], ["庚", 10]],
        [["丁", 70], ["己", 30]],
        [["己", 60], ["丁", 30], ["乙", 10]],
        [["庚", 60], ["壬", 30], ["戊", 10]],
        [["辛", 100]],
        [["戊", 60], ["辛", 30], ["丁", 10]],
        [["壬", 70], ["甲", 30]]
    ];

    const NAYIN = ["海中金", "爐中火", "大林木", "路旁土", "劍鋒金", "山頭火", "澗下水", "城頭土", "白蠟金", "楊柳木",
        "泉中水", "屋上土", "霹靂火", "松柏木", "長流水", "沙中金", "山下火", "平地木", "壁上土", "金箔金",
        "覆燈火", "天河水", "大驛土", "釵釧金", "桑柘木", "大溪水", "沙中土", "天上火", "石榴木", "大海水"];

    // 六十甲子序號
    function jiazi(stemIdx, branchIdx) {
        for (let n = stemIdx; n < 60; n += 10) if (n % 12 === branchIdx) return n;
        return -1;
    }
    const jiaziName = n => STEMS[n % 10] + BRANCHES[n % 12];
    const nayinOf = n => NAYIN[Math.floor(n / 2)];
    const nayinElem = n => NAYIN[Math.floor(n / 2)].slice(-1);

    // 十神（七殺依通行排盤稱「偏官」）
    function tenGod(dmIdx, tIdx) {
        const de = STEM_ELEM[dmIdx], te = STEM_ELEM[tIdx];
        const same = (dmIdx % 2) === (tIdx % 2);
        if (de === te) return same ? "比肩" : "劫財";
        if (GEN[de] === te) return same ? "食神" : "傷官";
        if (OVER[de] === te) return same ? "偏財" : "正財";
        if (OVER[te] === de) return same ? "偏官" : "正官";
        return same ? "偏印" : "正印";   // GEN[te] === de
    }
    const GOD_GROUP = { 比肩: "比劫", 劫財: "比劫", 食神: "食傷", 傷官: "食傷", 偏財: "財星", 正財: "財星", 偏官: "官殺", 正官: "官殺", 偏印: "印星", 正印: "印星" };
    const GROUPS = ["比劫", "印星", "食傷", "財星", "官殺"];
    // 某五行相對日主五行屬於哪一類十神
    function groupOfElem(dmElem, e) {
        if (e === dmElem) return "比劫";
        if (GEN[dmElem] === e) return "食傷";
        if (OVER[dmElem] === e) return "財星";
        if (OVER[e] === dmElem) return "官殺";

    }
    function elemOfGroup(dmElem, g) {

    }

    // 十二長生
    const STAGES = ["長生", "沐浴", "冠帶", "臨官", "帝旺", "衰", "病", "死", "墓", "絕", "胎", "養"];

    function stageOf(stemIdx, branchIdx) {

    function stemHe(a, b) {

    }
    const BRANCH_HE6 = { 子丑: "土", 寅亥: "木", 卯戌: "火", 辰酉: "金", 巳申: "水", 午未: "火" };
    function branchHe(a, b) { return BRANCH_HE6[a + b] || BRANCH_HE6[b + a] || null; }
    const isClash = (a, b) => Math.abs(a - b) === 6;
    const SAN_HE = [["申", "子", "辰", "水"], ["亥", "卯", "未", "木"], ["寅", "午", "戌", "火"], ["巳", "酉", "丑", "金"]];
    const SAN_HUI = [["寅", "卯", "辰", "木"], ["巳", "午", "未", "火"], ["申", "酉", "戌", "金"], ["亥", "子", "丑", "水"]];

    const ELEM_COLOR = { 木: "#2e7d32", 火: "#c62828", 土: "#8d6e00", 金: "#9a7b00", 水: "#1565c0" };

    return { STEMS, BRANCHES, ZODIAC, STEM_ELEM, BRANCH_ELEM, ELEMS, GEN, OVER, HIDDEN, NAYIN,
        jiazi, jiaziName, nayinOf, nayinElem, tenGod, GOD_GROUP, GROUPS, groupOfElem, elemOfGroup,
        STAGES, stageOf, stemHe, branchHe, isClash, SAN_HE, SAN_HUI, ELEM_COLOR };
})();

/* ============================================================
 * 模組三：曆法（儒略日、日柱、農曆、真太陽時、四柱）
 * ============================================================ */
const Cal = (function () {
    const { STEMS, BRANCHES } = Data;

    function jdn(y, m, d) {
        const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
        return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
    }
    const dayJiazi = (y, m, d) => (((jdn(y, m, d) + 49) % 60) + 60) % 60;

    // 均時差（分鐘）
    function equationOfTime(y, m, d) {
        const N = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 0)) / 86400000);
        const B = 2 * Math.PI * (N - 81) / 365;
        return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
    }

    // 農曆：內嵌 1899~2101 年資料表（每年 6 碼：正月初一距 1/21 之日數、閏月、各月大小）
    const LUNAR_START = 1899;
    const LUNAR_TAB = "k00ad5a816d2t00752i00ea585164aq0064be00a9b441556n0056ac00b59121752k00752961b25s00b25g00a4b5514abo002add0056b220b69l00da9b71d92u00e92i00d25751a4dq00a56f002b63415b5n006d4c00ea9221e92k00e92960d26r0052bg00a575512b6o00b5ae006d4330ec9l00749a71693t00a93i0052b660a5bp00aadf0056a441b55n00ba4c00b49121a93k00a9587152dr00536g00aad6515aao005b2d00da5331d4am00d4aa80a95s00a97i00556760ab5p00ad5f006d2440ea5n00ea5c0064a030c97j00a9b97155ar0056ag00b69651752p00b52d00b2524164bl00a4ba814abs002adh0056d760b69q00da9f00d92441d25n00d25ca1a4du00a56j002b68605b5r006d5g00ea9651e92p00e92e00d26230a56k00a57a814d6t0035ah006d57516c9q00749f0069334152bm0052bb00a5b12155aj0056a871b55s00ba4h00b49551a93o00a95d0052d240aadk00ab5a915aat005d2i00da5761d4aq00d4af00c9544152em00556b00ab51215b2k006d2860ea5r00725g0064b550c97n00cabd0055a230ad6l00b69ab1752t00b52i00b25761a4bp00a4be004ab35055bm005adb00b6a121b52k00d92971d25r00d25g00a555514ado004b6c005b5230daal00ec9b81e92t00e92i00d26760a56p00a57e004d63406d5m00755c00749030e93j0069387152br0052bf00a5b55155ao0056ad00b6524174al00b4aa81a95t00a95h0052d660aadp00ab5f005aa340ba5m00da5c00d4a131c95j00c9687194er00556g00ab55515b2o006d2d00ea5340e4ak0068b980c97s004abh0055b660ad6p00b6af00752441725m00b45b00a8b02149bj004ab87095b";
    function lunarYearInfo(ly) {
        const i = (ly - LUNAR_START) * 6;
        if (i < 0 || i + 6 > LUNAR_TAB.length) throw new Error("出生年份超出支援範圍 (1900~2100)");
        const off = parseInt(LUNAR_TAB[i], 36), leap = parseInt(LUNAR_TAB[i + 1], 36), bits = parseInt(LUNAR_TAB.substr(i + 2, 4), 16);
        const months = []; let m = 1, k = 0;
        for (; k < (leap ? 13 : 12); k++) {
            const isLeap = leap > 0 && k === leap;           // 閏月緊接在同數字之月後
            months.push({ month: isLeap ? leap : m, leap: isLeap, days: (bits >> k) & 1 ? 30 : 29 });
            if (!isLeap) m++;
        }
        return { start: jdn(ly, 1, 21) + off, leap, months };
    }
    // 回傳 {year, month, day, leap}
    function lunarOf(y, m, d) {
        const j = jdn(y, m, d);
        let ly = y;
        if (j < lunarYearInfo(ly).start) ly--;
        const info = lunarYearInfo(ly);
        let rest = j - info.start;
        for (const mo of info.months) {
            if (rest < mo.days) return { year: ly, month: mo.month, leap: mo.leap, day: rest + 1 };
            rest -= mo.days;
        }
        throw new Error("農曆轉換失敗");
    }
    const MONTH_CN = ["正", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二"];
    const DAY_CN = ["初一", "初二", "初三", "初四", "初五", "初六", "初七", "初八", "初九", "初十", "十一", "十二", "十三", "十四", "十五",
        "十六", "十七", "十八", "十九", "二十", "廿一", "廿二", "廿三", "廿四", "廿五", "廿六", "廿七", "廿八", "廿九", "三十"];
    const lunarText = l => `${STEMS[(l.year - 4) % 10]}${BRANCHES[(l.year - 4) % 12]}年${l.leap ? "閏" : ""}${MONTH_CN[l.month - 1]}月${DAY_CN[l.day - 1]}`;
    const hourBranchOf = h => Math.floor(((h + 1) % 24) / 2);

    /**
     * 依輸入換算各種時間基準
     * inp: {y,m,d,H,M, lon, tz, useTST, zishi:'next'|'same'}
     */
    function resolveTime(inp) {
        const clockMs = Date.UTC(inp.y, inp.m - 1, inp.d, inp.H, inp.M);
        const instantMs = clockMs - inp.tz * 3600000;                 // 真實時刻 (UTC)
        let offsetMin = 0;
        if (inp.useTST) offsetMin = (inp.lon - inp.tz * 15) * 4 + equationOfTime(inp.y, inp.m, inp.d);
        const eff = new Date(clockMs + Math.round(offsetMin * 60000));
        const ey = eff.getUTCFullYear(), em = eff.getUTCMonth() + 1, ed = eff.getUTCDate(), eh = eff.getUTCHours(), emin = eff.getUTCMinutes();
        const hourBranch = hourBranchOf(eh);
        const late = (eh === 23);                                       // 晚子時
        const nextDay = new Date(Date.UTC(ey, em - 1, ed + 1));
        const nd = { y: nextDay.getUTCFullYear(), m: nextDay.getUTCMonth() + 1, d: nextDay.getUTCDate() };
        const own = { y: ey, m: em, d: ed };
        const dayRef = (late && inp.zishi === "next") ? nd : own;       // 日柱、農曆日所採日期
        const hourStemRef = late ? nd : own;                            // 時干起算之日（晚子時皆用次日日干）
        return { clockMs, instantMs, offsetMin, effText: `${ey}-${String(em).padStart(2, "0")}-${String(ed).padStart(2, "0")} ${String(eh).padStart(2, "0")}:${String(emin).padStart(2, "0")}`,
            hourBranch, late, dayRef, hourStemRef };
    }

    // 四柱
    function fourPillars(inp) {
        const t = resolveTime(inp);
        const { prev, next } = Astro.nearestTerms(t.instantMs);
        const bzYear = prev.idx === 0 ? prev.year - 1 : prev.year;       // 小寒(1月)仍屬前一年，立春後換年
        const yStem = ((bzYear - 4) % 10 + 10) % 10, yBranch = ((bzYear - 4) % 12 + 12) % 12;
        const mBranch = (prev.idx + 1) % 12;
        const mStem = ((yStem % 5) * 2 + 2 + ((mBranch - 2 + 12) % 12)) % 10;
        const dj = dayJiazi(t.dayRef.y, t.dayRef.m, t.dayRef.d);
        const dStem = dj % 10, dBranch = dj % 12;
        const hj = dayJiazi(t.hourStemRef.y, t.hourStemRef.m, t.hourStemRef.d);
        const hStem = (((hj % 10) % 5) * 2 + t.hourBranch) % 10;
        const mk = (s, b) => ({ stemIdx: s, branchIdx: b, stem: STEMS[s], branch: BRANCHES[b], gz: STEMS[s] + BRANCHES[b], jiazi: Data.jiazi(s, b) });
        return { time: t, prevTerm: prev, nextTerm: next, bzYear,
            year: mk(yStem, yBranch), month: mk(mStem, mBranch), day: mk(dStem, dBranch), hour: mk(hStem, t.hourBranch) };
    }

    return { jdn, dayJiazi, equationOfTime, lunarOf, lunarText, MONTH_CN, DAY_CN, hourBranchOf, resolveTime, fourPillars };
})();

/* ============================================================
 * 模組四：八字排盤（四柱、十神、藏干、納音、空亡、大運）
 * ============================================================ */
const Bazi = (function () {
    const { STEMS, BRANCHES, HIDDEN } = Data;
    const YEAR_MS = 365.2425 * 86400000;

    function kongwang(jiazi) {
        const xun = Math.floor(jiazi / 10);
        return [(10 - 2 * xun + 12) % 12, (11 - 2 * xun + 12) % 12];
    }

    // 某一時刻所屬之「八字年」(以立春換年)
    function baziYearAt(ms) {
        const { prev } = Astro.nearestTerms(ms);
        return prev.idx === 0 ? prev.year - 1 : prev.year;
    }
    const yearPillar = y => ({ stemIdx: ((y - 4) % 10 + 10) % 10, branchIdx: ((y - 4) % 12 + 12) % 12 });

    function compute(inp) {
        const fp = Cal.fourPillars(inp);
        const dm = fp.day.stemIdx;
        const keys = ["year", "month", "day", "hour"];
        keys.forEach(k => {
            const p = fp[k];
            p.stemElem = Data.STEM_ELEM[p.stemIdx];
            p.branchElem = Data.BRANCH_ELEM[p.branchIdx];
            p.god = k === "day" ? "日主" : Data.tenGod(dm, p.stemIdx);
            p.hidden = HIDDEN[p.branchIdx].map(([s, w]) => {
                const si = STEMS.indexOf(s);
                return { stem: s, stemIdx: si, weight: w, elem: Data.STEM_ELEM[si], god: Data.tenGod(dm, si) };
            });
            p.nayin = Data.nayinOf(p.jiazi);
            p.stage = Data.stageOf(dm, p.branchIdx);          // 日主於此支之十二運
            p.selfStage = Data.stageOf(p.stemIdx, p.branchIdx); // 自坐
        });
        const kwYear = kongwang(fp.year.jiazi), kwDay = kongwang(fp.day.jiazi);
        fp.kongwang = { year: kwYear, day: kwDay,
            hit: keys.filter(k => k !== "day" && kwDay.includes(fp[k].branchIdx)).concat(keys.filter(k => k !== "year" && kwYear.includes(fp[k].branchIdx))) };

        // 農曆
        const dr = fp.time.dayRef;
        fp.lunar = Cal.lunarOf(dr.y, dr.m, dr.d);
        fp.zodiac = Data.ZODIAC[fp.year.branchIdx];                 // 八字年生肖(立春換年)
        fp.lunarZodiac = Data.ZODIAC[((fp.lunar.year - 4) % 12 + 12) % 12];

        // ---- 大運 ----
        const male = inp.gender === "男";
        const yangYear = fp.year.stemIdx % 2 === 0;
        const forward = (yangYear && male) || (!yangYear && !male);
        const target = forward ? fp.nextTerm : fp.prevTerm;
        const D = Math.abs(target.ms - fp.time.instantMs) / 86400000;      // 距節氣日數
        const yrs = D / 3;                                                  // 三日折一年
        const yy = Math.floor(yrs), fm = (yrs - yy) * 12, mm = Math.floor(fm), dd = Math.floor((fm - mm) * 30);
        const startAge = yy + 1;                                            // 虛歲
        const bd = new Date(fp.time.clockMs);
        const sd = new Date(Date.UTC(bd.getUTCFullYear() + yy, bd.getUTCMonth() + mm, bd.getUTCDate() + dd));
        const list = [];
        for (let i = 1; i <= 10; i++) {
            const jz = ((fp.month.jiazi + (forward ? i : -i)) % 60 + 60) % 60;
            const s = jz % 10, b = jz % 12;
            list.push({ no: i, jiazi: jz, stemIdx: s, branchIdx: b, gz: STEMS[s] + BRANCHES[b], god: Data.tenGod(dm, s),
                hiddenGods: HIDDEN[b].map(([h]) => Data.tenGod(dm, STEMS.indexOf(h))),
                ageFrom: startAge + 10 * (i - 1), ageTo: startAge + 10 * (i - 1) + 9,
                yearFrom: fp.bzYear + startAge + 10 * (i - 1) - 1 + 0 });
        }
        // 起運西元年以出生民用年計
        const birthCivilYear = new Date(fp.time.clockMs).getUTCFullYear();
        list.forEach(x => { x.yearFrom = birthCivilYear + x.ageFrom - 1; x.yearTo = birthCivilYear + x.ageTo - 1; });
        fp.dayun = { forward, male, yangYear, targetTerm: target, days: D, years: yy, months: mm, remainDays: dd, startAge,
            startText: `出生後 ${yy} 年 ${mm} 個月 ${dd} 天起運`, startDate: `${sd.getUTCFullYear()}年${sd.getUTCMonth() + 1}月${sd.getUTCDate()}日`,
            startYears: yrs, list };
        fp.gender = inp.gender;
        return fp;
    }

    // 以排盤時刻 refMs 求目前歲數、行運
    function nowInfo(fp, refMs) {
        const ageFrac = (refMs - fp.time.instantMs) / YEAR_MS;
        const age = Math.floor(ageFrac);                   // 實歲
        const dy = fp.dayun;
        let cur = null;
        if (ageFrac >= dy.startYears) {
            const i = Math.min(10, Math.floor((ageFrac - dy.startYears) / 10) + 1);
            cur = dy.list[i - 1];
        }
        const y = baziYearAt(refMs);
        return { age, ageFrac, dayun: cur, flowYear: y, flowYearPillar: yearPillar(y) };
    }
    return { compute, nowInfo, baziYearAt, yearPillar, kongwang };
})();

        癸: ["破軍", "巨門", "太陰", "貪狼"]
    };
    const HUA_NAME = ["祿", "權", "科", "忌"];
    const CHANGSHENG = ["長生", "沐浴", "冠帶", "臨官", "帝旺", "衰", "病", "死", "墓", "絕", "胎", "養"];
    const BOSHI = ["博士", "力士", "青龍", "小耗", "將軍", "奏書", "飛廉", "喜神", "病符", "大耗", "伏兵", "官府"];

    const MING_ZHU = ["貪狼", "巨門", "祿存", "文曲", "廉貞", "武曲", "破軍", "武曲", "廉貞", "文曲", "祿存", "巨門"];
    const SHEN_ZHU = ["火星", "天相", "天梁", "天同", "文昌", "天機", "火星", "天相", "天梁", "天同", "文昌", "天機"];
    const MAIN_NOTE = {
        紫微: "尊貴領導、重名望", 天機: "聰明機變、善謀略", 太陽: "熱情外放、重名聲", 武曲: "剛毅務實、主財星",
        天同: "溫和享福、隨緣", 廉貞: "感情複雜、公關能力強", 天府: "穩重保守、庫星", 太陰: "細膩內斂、重不動產",
        貪狼: "多才多藝、慾望強", 巨門: "口才分析、是非多", 天相: "輔佐協調、重形象", 天梁: "清高蔭庇、長者緣",
        七殺: "將星果決、衝勁強", 破軍: "開創變動、破舊立新"
    };
    function grp(y) { // 年支分組：0=寅午戌 1=申子辰 2=巳酉丑 3=亥卯未
        if ([2, 6, 10].includes(y)) return 0;
        if ([8, 0, 4].includes(y)) return 1;
        if ([5, 9, 1].includes(y)) return 2;
        return 3;
    }

    function ziweiPos(day, ju) {
        let x = 0; while ((day + x) % ju !== 0) x++;
        const q = (day + x) / ju;
        const pos = 2 + (q - 1);
        return mod(x % 2 === 1 ? pos - x : pos + x);
    }

    function compute(z) {
        const L = z.lunar, h = z.hourBranch, d = L.day, male = z.male;
        const yS = ((L.year - 4) % 10 + 10) % 10, yB = ((L.year - 4) % 12 + 12) % 12;
        let m = L.month; if (L.leap && L.day > 15) m = m % 12 + 1;     // 閏月十五日後算下月

        const put = (n, b, kind) => { b = mod(b); const c = cells[b]; const o = { n, hua: huaOf(n), kind };
            if (kind === "main") { o.br = BRIGHT[n] ? BRIGHT[n][b] : ""; c.main.push(o); } else { if (BRIGHT[n] && BRIGHT[n][b] && BRIGHT[n][b] !== "-") o.br = BRIGHT[n][b]; c.minor.push(o); } return b; };

        // ---- 十四主星 ----
        const zw = ziweiPos(d, ju), tf = mod(4 - zw);
        [["紫微", 0], ["天機", -1], ["太陽", -3], ["武曲", -4], ["天同", -5], ["廉貞", -8]].forEach(([n, o]) => put(n, zw + o, "main"));
        [["天府", 0], ["太陰", 1], ["貪狼", 2], ["巨門", 3], ["天相", 4], ["天梁", 5], ["七殺", 6], ["破軍", 10]].forEach(([n, o]) => put(n, tf + o, "main"));

        // ---- 六吉 ----
        const zuo = put("左輔", 4 + (m - 1), "good"), you = put("右弼", 10 - (m - 1), "good");
        const chang = put("文昌", 10 - h, "good"), qu = put("文曲", 4 + h, "good");
        const KUI = { 甲: [1, 7], 戊: [1, 7], 庚: [1, 7], 乙: [0, 8], 己: [0, 8], 丙: [11, 9], 丁: [11, 9], 壬: [3, 5], 癸: [3, 5], 辛: [6, 2] }[STEMS[yS]];
        put("天魁", KUI[0], "good"); put("天鉞", KUI[1], "good");
        // ---- 六煞、祿存、天馬 ----
        const lu = put("祿存", [2, 3, 5, 6, 5, 6, 8, 9, 11, 0][yS], "good");
        put("擎羊", lu + 1, "bad"); put("陀羅", lu - 1, "bad");
        const g = grp(yB);
        const huoStart = [1, 2, 3, 9][g], lingStart = [3, 10, 10, 10][g];
        put("火星", huoStart + h, "bad"); put("鈴星", lingStart + h, "bad");
        put("地空", 11 - h, "bad"); put("地劫", 11 + h, "bad");
        put("天馬", [8, 2, 11, 5][g], "misc");
        // ---- 雜曜 ----
        const hong = mod(3 - yB); put("紅鸞", hong, "misc"); put("天喜", hong + 6, "misc");

        const gu = [[2, 10], [5, 1], [8, 4], [11, 7]][[11, 0, 1].includes(yB) ? 0 : [2, 3, 4].includes(yB) ? 1 : [5, 6, 7].includes(yB) ? 2 : 3];

            c.suiqian = SUIQIAN[mod(b - refB)];
            c.jiangqian = JIANGQIAN[mod(b - jqStart)];
            c.huaList = [];
        });
        hua.forEach((n, i) => {
            cells.forEach(c => c.main.concat(c.minor).forEach(s => { if (s.n === n) c.huaList.push(n + "化" + HUA_NAME[i]); }));
        });

        // 目前歲數 (虛歲) 與標記
        const nowAge = z.refYear - L.year + 1;
        cells.forEach((c, b) => {
            c.flowYear = (b === refB);
            c.curDaxian = nowAge >= c.daxian[0] && nowAge <= c.daxian[1];
            c.curXiaoxian = (b === (male ? mod(xStart + nowAge - 1) : mod(xStart - (nowAge - 1))));
        });

        return { laiyin, lunar: L, monthUsed: m, hourBranch: h, life, body, ju, juName, fwd, male, yearStem: STEMS[yS], yearBranch: BRANCHES[yB],

    }

    function sanfang(zw, b) { return [b, mod(b + 6), mod(b + 4), mod(b + 8)].map(i => zw.cells[i]); }
    return { compute, sanfang, PALACE, MAIN_NOTE, MAIN_STARS, HUA, HUA_NAME, mod };
})();

        [5.0, "命重偏上", "男命：福祿較佳，名利可期，易得長輩與上司提攜；宜謙和處世，守住既有成就。", "女命：福分深厚，家庭與事業皆能有所成就，受人敬重；需留意情緒，勿過度操心。"],
        [5.5, "命重上等", "男命：格局較大，能成就事業、獲得名望，一生較少大起大落；宜廣結善緣，以德行守福。", "女命：氣度大方，旺家助人，受家人倚重；晚年生活優渥，子女有成。"],
        [6.0, "命重甚重", "男命：富貴之格，能擔重任、掌權柄，責任亦重；宜持正守信，居安思危。", "女命：貴氣在身，有主見有威望，家業興旺；宜以柔濟剛，婚姻上多包容。"],
        [99, "命重極重", "男命：命格貴重，宜多行善積德，擔當要職而不失本心，福澤延及後代。", "女命：福澤深厚，晚景尊榮；宜謙和低調，廣種福田，則福氣長久。"]
    ];
    function bone(fp) {
        const ly = fp.lunar;
        const yj = D.jiazi(((ly.year - 4) % 10 + 10) % 10, ((ly.year - 4) % 12 + 12) % 12);
        const parts = { year: BONE_YEAR[yj], month: BONE_MONTH[ly.month - 1], day: BONE_DAY[ly.day - 1], hour: BONE_HOUR[fp.time.hourBranch] };
        const total = Math.round((parts.year + parts.month + parts.day + parts.hour) * 10) / 10;
        const liang = Math.floor(total + 1e-9), qian = Math.round((total - liang) * 10);
        const text = total < 3.0 ? "命重偏輕：早年多靠自力更生，起步較辛苦，宜以專業技能與穩定累積取勝，中晚年漸入佳境。"
            : total < 4.0 ? "命重中等：一生衣食無虞，中年後穩定發展，宜守本分、重人緣與口碑，努力可見成果。"
            : total < 5.0 ? "命重中上：福祿較佳，事業財運有成，貴人與機會較多，宜把握中年運勢。"
            : total < 6.0 ? "命重偏重：福厚運佳，名利兼收，宜謙虛處世、廣結善緣以守住福氣。" : "命重極重：命格貴重，宜多行善積德，擔當重任而不失本心。";
        const tier = BONE_TIER.find(t => total < t[0]);
        return { parts, total, liang, qian, label: `${liang}兩${qian ? qian + "錢" : ""}`, text, tierName: tier[1], male: tier[2], female: tier[3] };
    }

    function lifestyle(fp, an) {
        const fav = an.favElems, bad = an.badElems;
        const join = (map, es, sep) => es.map(e => map[e]).join(sep || "；");
        return {
            job: join(JOB, fav, "；"),
            nature: PATTERN_JOB[an.pattern.name] || "",
            dir: fav.map(e => DIR[e]).join("、"),
            color: fav.map(e => `${e}：${COLOR[e]}`).join("；"),
            num: fav.map(e => NUM[e]).join("、"),
            body: bad.map(e => `${e}（${BODY[e]}）`).join("；")
        };
    }

    return { analyze, bone, lifestyle, GAN_DESC, NAYIN_NOTE, KEYS, PILLAR_CN };
})();

/* ============================================================
 * 模組九：八字 × 紫微 綜合總結（各面向指數、相似度、吉凶程度）
 *   指數 0~100：50 為中性，越高越吉。屬輔助參考的啟發式評分。
 * ============================================================ */
const Summary = (function () {
    const D = Data;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const BR = { 廟: 2, 旺: 2, 得: 1, 利: 1, 平: 0, 不: -1, 陷: -2 };
    const HUA = { 祿: 2, 權: 1.5, 科: 1, 忌: -2 };

    // 紫微：某宮三方四正評分
    function palaceScore(zw, branchIdx) {
        const cells = Ziwei.sanfang(zw, branchIdx);
        let raw = 0;
        cells.forEach((c, i) => {
            const w = i === 0 ? 1.5 : 1;
            c.main.forEach(s => { raw += w * ((BR[s.br] || 0) + (HUA[s.hua] || 0)); });
            c.minor.forEach(s => {
                if (s.kind === "good") raw += w * (1 + (HUA[s.hua] || 0));
                else if (s.kind === "bad") raw -= w * 1.5;
            });
        });
        return clamp(Math.round(32 + raw * 3.5), 5, 95);   // 以 1500 組隨機命盤校準，使各宮分數中位數約 50
    }
    // 八字：某十神群組面向
    function groupScore(an, g) {
        const e = D.elemOfGroup(an.dmE, g), v = an.val[e] || 0, p = an.groupPct[g];
        return clamp(Math.round(50 + 12 * v + (p < 6 ? -6 : p >= 15 ? 4 : 0)), 10, 95);
    }
    const idxOfGrade = g => clamp(Math.round((g.score + 2) / 6 * 100), 5, 95);
    const labelOf = s => s >= 75 ? "大吉" : s >= 62 ? "吉" : s >= 53 ? "吉多於凶" : s >= 45 ? "平順" : s >= 35 ? "凶多於吉" : "偏凶";
    const clsOf = s => s >= 62 ? "good" : s >= 45 ? "neutral" : "bad";
    const simOf = d => d <= 12 ? "高度一致" : d <= 25 ? "大致相近" : "有所分歧";

    function build(fp, an, zw, now, inp) {
        const male = inp.gender === "男";
        // 八字運勢
        const fy = now.flowYearPillar, gF = an.grade(fy.stemIdx, fy.branchIdx);
        const gD = now.dayun ? an.grade(now.dayun.stemIdx, now.dayun.branchIdx) : null;
        const fortuneB = gD ? Math.round(idxOfGrade(gD) * 0.5 + idxOfGrade(gF) * 0.5) : idxOfGrade(gF);
        // 紫微運勢
        const dxCell = zw.cells.find(c => c.curDaxian), fyCell = zw.cells.find(c => c.flowYear);
        const fortuneZ = Math.round((palaceScore(zw, dxCell ? dxCell.branchIdx : zw.life) + palaceScore(zw, fyCell.branchIdx)) / 2);
        // 格局
        const pctYong = an.groupPct[an.yong.group];
        const patB = clamp(Math.round(55 + (pctYong - 12) * 1.2 + (/極/.test(an.strength.level) ? -10 : 0)), 15, 90);
        const spread = Math.max(...Object.values(an.pctAdj)) - Math.min(...Object.values(an.pctAdj));
        const healthB = clamp(Math.round(100 - spread * 1.1 + (/中和/.test(an.strength.level) ? 8 : /極/.test(an.strength.level) ? -8 : 0)), 15, 90);
        const pal = n => palaceScore(zw, zw.cells.find(c => c.name === n).branchIdx);
        const rows = [
            { name: "整體格局", b: patB, z: pal("命宮"), bn: `用神${an.yong.group}占 ${pctYong}%，日主${an.strength.level}`, zn: "命宮三方四正星曜吉煞" },
            { name: "事業官運", b: groupScore(an, "官殺"), z: pal("官祿"), bn: `官殺為${an.val[D.elemOfGroup(an.dmE, "官殺")] > 0 ? "喜" : "忌"}`, zn: "官祿宮三方四正" },
            { name: "財運財源", b: groupScore(an, "財星"), z: pal("財帛"), bn: `財星為${an.val[D.elemOfGroup(an.dmE, "財星")] > 0 ? "喜" : "忌"}，占 ${an.groupPct["財星"]}%`, zn: "財帛宮三方四正" },
            { name: "感情婚姻", b: groupScore(an, male ? "財星" : "官殺"), z: pal("夫妻"), bn: `${male ? "財星" : "官殺"}為配偶星`, zn: "夫妻宮三方四正" },
            { name: "身體健康", b: healthB, z: pal("疾厄"), bn: `五行${spread >= 25 ? "偏枯" : "尚稱均衡"}（落差 ${spread}%）`, zn: "疾厄宮三方四正" },
            { name: "當前運勢", b: fortuneB, z: fortuneZ, bn: `${gD ? now.dayun.gz + "大運" + gD.label + "、" : ""}${now.flowYear}流年${gF.label}`, zn: `大限${dxCell ? dxCell.name + "宮" : ""}、流年${fyCell.name}宮` }
        ];
        rows.forEach(r => { r.diff = Math.abs(r.b - r.z); r.sim = simOf(r.diff); r.c = Math.round(r.b * 0.7 + r.z * 0.3); r.label = labelOf(r.c); });
        const avgDiff = rows.reduce((a, r) => a + r.diff, 0) / rows.length;
        const similarity = clamp(Math.round(100 - avgDiff * 1.6), 0, 100);
        const overall = Math.round(rows.reduce((a, r) => a + r.c, 0) / rows.length);
        const same = rows.filter(r => r.diff <= 12).length;
        const sorted = rows.filter(r => r.name !== "當前運勢").slice().sort((a, b) => b.c - a.c);
        const best = sorted.slice(0, 2), worst = sorted.slice(-2).reverse();
        const split = rows.filter(r => r.diff > 25);
        return { rows, similarity, overall, label: labelOf(overall), cls: clsOf(overall), same, best, worst, split, fortuneB, fortuneZ };
    }

    function render(S) {
        const bar = (v, cls) => `<div class="sbar"><div class="sbar-fill sb-${cls}" style="width:${v}%"></div><span>${v}</span></div>`;
        const body = S.rows.map(r => `<tr><td><b>${r.name}</b></td>
            <td>${bar(r.b, clsOf(r.b))}<small>${r.bn}</small></td><td>${bar(r.z, clsOf(r.z))}<small>${r.zn}</small></td>
            <td>${r.sim}<br><small>差 ${r.diff}</small></td><td><span class="badge b-${clsOf(r.c)}">${r.label}</span><br><small>${r.c} 分</small></td></tr>`).join("");
        return `<h2 class="sec-title">【 八 字 × 紫 微 綜 合 總 結 】</h2>
        <div class="card"><div class="sum-head">
            <div><small>兩者相似度</small><b>${S.similarity}%</b><span>${S.same}／${S.rows.length} 項高度一致</span></div>
            <div><small>綜合吉凶程度（八字 7 成、紫微 3 成）</small><b>${S.overall} 分</b><span class="badge b-${S.cls}">${S.label}</span></div></div>
          <table class="tbl small"><thead><tr><th>面向</th><th>八字指數</th><th>紫微指數</th><th>相似程度</th><th>綜合</th></tr></thead><tbody>${body}</tbody></table>
          <ul>
            <li><b>相對有利</b>：${S.best.map(r => `${r.name}（${r.c} 分・${r.label}）`).join("、")}，可作為發展重心。</li>
            <li><b>需要留意</b>：${S.worst.map(r => `${r.name}（${r.c} 分・${r.label}）`).join("、")}，宜多加防範或補強。</li>
            ${S.split.length ? `<li><b>兩者分歧</b>：${S.split.map(r => `${r.name}（八字 ${r.b}／紫微 ${r.z}）`).join("、")}。八字看五行喜忌的整體氣勢，紫微看星曜落宮的事件窗口，分歧處宜以八字為主、紫微為輔。</li>` : `<li><b>兩者分歧</b>：各面向走向大致相同，互相印證度高。</li>`}
          </ul>
          <p class="note">指數以 50 為中性、越高越吉；八字依用神喜忌、十神與運歲吉凶計算，紫微依三方四正星曜廟陷、吉煞星與四化計算。為輔助判讀之啟發式評分，不代表命運定論。</p></div>`;
    }
    return { build, render, palaceScore, labelOf, clsOf };
})();

/* ============================================================
 * 模組十：流運查詢（流年、流月、流日、流時；八字＋紫微）
 *   八字：取查詢時刻的年/月/日/時柱，對原局論沖合刑害與喜忌。
 *   紫微：斗君法 —— 流年宮起正月逆數至生月，再由該宮起子時順數至生時為斗君(流年正月)；
 *         流月＝斗君順數 (流月-1)，流日＝流月宮順數 (日-1)，流時＝流日宮起子順數至該時辰。
 *         各層四化取該層天干(流年取農曆年干；流月以五虎遁依農曆月；流日/流時取日柱/時柱干；大限取大限宮干)。
 * ============================================================ */
const Flow = (function () {
    const D = Data, mod = n => ((n % 12) + 12) % 12;
    const BR = D.BRANCHES, PN = { year: "年", month: "月", day: "日", hour: "時" };
    const XING = [[2, 5], [5, 8], [8, 2], [1, 10], [10, 7], [7, 1], [0, 3]];
    const SELF = [4, 6, 9, 11];
    const HAI = [[0, 7], [1, 6], [2, 5], [3, 4], [8, 11], [9, 10]];
    const has = (list, a, b) => list.some(([x, y]) => (x === a && y === b) || (x === b && y === a));

    function relations(b, fp) {
        const out = [];
        ["year", "month", "day", "hour"].forEach(k => {
            const o = fp[k].branchIdx, name = `${PN[k]}支${BR[o]}`;
            if (D.isClash(b, o)) out.push({ t: "沖", k, text: `${BR[b]}沖${name}` });
            const he = D.branchHe(BR[b], BR[o]); if (he) out.push({ t: "合", k, text: `${BR[b]}合${name}（${he}）` });
            if (has(XING, b, o) || (b === o && SELF.includes(b))) out.push({ t: "刑", k, text: `${BR[b]}刑${name}` });
            if (has(HAI, b, o)) out.push({ t: "害", k, text: `${BR[b]}害${name}` });
        });
        return out;
    }
    const locate = (zw, star) => { for (const c of zw.cells) if (c.main.concat(c.minor).some(s => s.n === star)) return c; return null; };

    function huaPlaces(zw, stemChar) {
        const hs = Ziwei.HUA[stemChar];
        return hs.map((n, i) => { const c = locate(zw, n); return { hua: Ziwei.HUA_NAME[i], star: n, cell: c }; });
    }

    // inp: 排盤輸入；q: {y,m,d,H,M}
    function compute(ctx, q) {
        const { inp, fp, an, zw } = ctx;
        const f = Cal.fourPillars({ y: q.y, m: q.m, d: q.d, H: q.H, M: q.M, lon: inp.lon, tz: inp.tz, useTST: inp.useTST, zishi: inp.zishi });
        const L = Cal.lunarOf(f.time.dayRef.y, f.time.dayRef.m, f.time.dayRef.d);
        const lyS = ((L.year - 4) % 10 + 10) % 10, lyB = ((L.year - 4) % 12 + 12) % 12;
        // ---- 八字 ----
        const bz = ["year", "month", "day", "hour"].map(k => {
            const p = f[k], g = an.grade(p.stemIdx, p.branchIdx);
            return { key: k, label: "流" + PN[k], gz: p.gz, stemIdx: p.stemIdx, branchIdx: p.branchIdx, god: D.tenGod(fp.day.stemIdx, p.stemIdx),
                hidden: D.HIDDEN[p.branchIdx].map(([h]) => D.tenGod(fp.day.stemIdx, D.STEMS.indexOf(h))), grade: g, rel: relations(p.branchIdx, fp) };
        });
        // ---- 紫微 ----
        let fm = L.month; if (L.leap && L.day > 15) fm = fm % 12 + 1;
        const birthM = zw.monthUsed, birthH = zw.hourBranch;
        const dj = mod(lyB - (birthM - 1) + birthH);                 // 斗君
        const mP = mod(dj + (fm - 1)), dP = mod(mP + (L.day - 1)), hP = mod(dP + f.time.hourBranch);
        const age = L.year - fp.lunar.year + 1;                       // 農曆虛歲
        const dx = zw.cells.find(c => age >= c.daxian[0] && age <= c.daxian[1]) || null;
        const levels = [
            { label: "大限", pos: dx ? dx.branchIdx : null, stem: dx ? dx.stem : null, note: dx ? `${dx.daxian[0]}～${dx.daxian[1]}歲` : "未入大限" },
            { label: "流年", pos: lyB, stem: D.STEMS[lyS], note: `${D.STEMS[lyS]}${BR[lyB]}年（農曆）` },
            { label: "流月", pos: mP, stem: D.STEMS[([2, 4, 6, 8, 0][lyS % 5] + fm - 1) % 10], note: `農曆${Cal.MONTH_CN[fm - 1]}月（月干依五虎遁）` },
            { label: "流日", pos: dP, stem: f.day.stem, note: `農曆${Cal.DAY_CN[L.day - 1]}，日柱${f.day.gz}` },
            { label: "流時", pos: hP, stem: f.hour.stem, note: `${BR[f.time.hourBranch]}時，時柱${f.hour.gz}` }
        ].map(v => {
            if (v.pos === null) return v;
            const cell = zw.cells[v.pos], ji = zw.cells[mod(v.pos - 5)];
            const sanfang = Ziwei.sanfang(zw, v.pos);
            const bad = sanfang.reduce((a, c) => a + c.minor.filter(s => s.kind === "bad").length, 0);
            v.cell = cell; v.ji = ji; v.score = Summary.palaceScore(zw, v.pos); v.bad = bad;
            v.hua = huaPlaces(zw, v.stem);
            v.jiHit = v.hua.find(h => h.hua === "忌");
            return v;
        });
        return { f, L, bz, levels, dj, age };
    }

    const colored = (t, e) => `<span class="el el-${e}">${t}</span>`;
    function render(r, ctx) {
        const { fp, an } = ctx;
        const tag = x => `<span class="badge b-${x.grade.cls}">${x.grade.label}</span>`;
        const bzRows = r.bz.map(x => `<tr><td><b>${x.label}</b></td><td class="gz">${colored(x.gz[0], D.STEM_ELEM[x.stemIdx])}${colored(x.gz[1], D.BRANCH_ELEM[x.branchIdx])}</td>
            <td>${x.god}<br><small>${x.hidden.join("/")}</small></td><td>${tag(x)}</td>
            <td class="left"><small>${x.rel.length ? x.rel.map(y => `<span class="rel rel-${y.t}">${y.text}</span>`).join("　") : "與原局無沖合刑害"}${x.grade.notes.length ? "<br>" + x.grade.notes.join("；") : ""}</small></td></tr>`).join("");
        const zwRows = r.levels.map(v => {
            if (!v.cell) return `<tr><td><b>${v.label}</b></td><td colspan="5" class="left">${v.note}</td></tr>`;
            const mains = (v.cell.main.length ? v.cell.main : zw0(ctx).cells[mod(v.pos + 6)].main).map(s => s.n + (s.hua ? "化" + s.hua : "")).join("、") || "無主星";
            const sha = v.cell.minor.filter(s => s.kind === "bad").map(s => s.n).join("、");
            const jiSha = v.ji.minor.filter(s => s.kind === "bad").map(s => s.n).join("、");
            const huaTxt = v.hua.map(h => `<span class="hua hua-${h.hua}">化${h.hua}</span>${h.star}→${h.cell ? h.cell.name : "—"}`).join("　");
            return `<tr><td><b>${v.label}</b><br><small>${v.note}</small></td><td>${BR[v.pos]}宮（本命${v.cell.name}）</td>
                <td class="left">${mains}${sha ? `<br><small>煞：${sha}</small>` : ""}</td>

/* ============================================================

const UI = (function () {

                <li><b>用神</b>：<span class="badge b-good">${an.yong.group}（${an.yong.elem}）</span>　${esc(an.yongWhy)}</li>
                <li><b>喜神</b>：${an.xi.map(x => `${x.group}（${x.elem}）`).join("、")}　<b>忌神</b>：${an.ji.map(x => `<span class="badge b-bad">${x.group}（${x.elem}）</span>`).join(" ")}</li>
                <li><b>行運</b>：喜${an.favText}運，忌${an.badText}運。</li>
                <li><b>日主特質</b>：${A.GAN_DESC[dm]}</li>
              </ul>
              <div class="quote">${esc(an.summary)}</div></div>

            <div class="card"><h3>三、十年大運吉凶</h3><p>${curTxt}</p>${dayunTable(fp, an, now)}</div>

            <div class="card"><h3>四、流年運勢（排盤日期 ${inp.ref.y}/${inp.ref.m}/${inp.ref.d}）</h3>
              <p>流年：${now.flowYear}，${fyGz}年　${now.dayun ? `大運：${now.dayun.gz}（${curDyG.label}）` : ""}　今年流年：<span class="badge b-${fyG.cls}">${fyG.label}</span></p>
              <p>${esc(fyG.advice)}${now.dayun ? "大運" + esc(curDyG.advice) : ""}</p>
              ${flowTable(fp, an, now, now.flowYear)}
              <p class="note">流年運勢以命主之八字喜忌，配合大運與流年干支推算，僅供參考。</p></div>

            <div class="card"><h3>五、趨吉避凶</h3><ul>
              <li><b>行業選擇</b>：命局喜${an.favText}，適合${esc(life.job)}。</li>
              <li><b>職業性質</b>：局成${an.pattern.name}，${esc(life.nature)}</li>
              <li><b>吉利方位</b>：${life.dir}。</li>
              <li><b>幸運色彩</b>：${esc(life.color)}。</li>
              <li><b>幸運數字</b>：${life.num}。</li>
              <li><b>身體保健</b>：命局忌${an.badText}，宜留意 ${esc(life.body)}。</li></ul></div>

            <div class="card"><h3>六、稱骨論命</h3>
              <div class="bone-blk"><span>命重</span><div><b>${bone.label}</b>　<small>年 ${bone.parts.year}＋月 ${bone.parts.month}＋日 ${bone.parts.day}＋時 ${bone.parts.hour}（${esc(inp.gender)}命）</small></div></div>
              <div class="bone-blk"><span>命批</span><div><b>${bone.tierName}</b>：${esc((inp.gender === "男" ? bone.male : bone.female).replace(/^[男女]命：/, ""))}</div></div>
              <div class="bone-blk"><span>歌訣大意</span><div>${esc(inp.gender === "男" ? bd.male : bd.female)}</div></div>
              <div class="bone-blk"><span>說明</span><div><small>1.「稱骨論命」依袁天罡「八字稱骨命術」，以出生農曆年、月、日、時查表相加得命重，男女命的批語不同。<br>2. 此法簡易，僅供參考；歌訣大意為依《秤骨歌》意旨整理的白話概述，非歌訣原文。</small></div></div></div>

            <div class="card"><h3>七、生肖與納音</h3><ul>
              <li><b>陽曆</b>：${fp.time.clockText}　<b>農曆</b>：${Cal.lunarText(fp.lunar)}${D.BRANCHES[fp.time.hourBranch]}時</li>
              <li><b>年柱納音</b>：${fp.year.gz}　${fp.year.nayin}　生肖屬${fp.zodiac}。${esc(A.NAYIN_NOTE[Data.nayinElem(fp.year.jiazi)])}</li></ul></div>

            <h2 class="sec-title">【 紫 微 斗 數 命 盤 】<small>（輔助參考）</small></h2>
            ${ziweiGrid(zw, fp, inp)}
            <div class="card">${ziweiFocus(zw, inp)}
              <p class="note">八字為主、紫微為輔：八字看天賦格局與喜忌取向，紫微看宮位落點與事件窗口，兩者相互參照。</p></div>
            ${Summary.render(Summary.build(fp, an, zw, now, inp))}
            <h2 class="sec-title">【 流 運 查 詢 】<small>（流年・流月・流日・流時）</small></h2>
            <div class="card"><div class="flow-form"><div class="form-group wide"><label>查詢日期</label><div class="dsel" id="flowDate"></div></div>
              <div class="form-group"><label>查詢時間</label><input type="time" id="flowTime" value="08:00"></div>
              <button class="btn small" id="flowBtn">查詢</button></div><div id="flowOut"></div></div>`;
            mountDate("flowDate", inp.ref.y, inp.ref.m, inp.ref.d); $("flowBtn").addEventListener("click", runFlow); runFlow();
            $("result").style.display = "block";
            out.scrollIntoView({ behavior: "smooth", block: "start" });
        } catch (e) { err.textContent = "排盤失敗：" + e.message; err.style.display = "block"; }
    }
    function fmtMs(ms) {
        const d = new Date(ms + 8 * 3600000);
        return `${d.getUTCFullYear()}/${d.getUTCMonth() + 1}/${d.getUTCDate()} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
    }

    function init() {
        Places.fillSelect($("birthPlace"), "臺北市");
        const now = new Date();
        mountDate("birthDate", 2008, 10, 29);
        mountDate("refDate", now.getFullYear(), now.getMonth() + 1, now.getDate());
        $("birthPlace").addEventListener("change", () => { $("customBox").style.display = $("birthPlace").value === "custom" ? "flex" : "none"; });
        $("genBtn").addEventListener("click", generate);
    }
    return { init, generate, readInput };
})();

document.addEventListener("DOMContentLoaded", UI.init);
</script>
</body>
</html>

    <title>紫微斗數線上排盤系統</title>
    <style>
:root {
    --bg-color: #f7f5f8;
    --card-bg: #ffffff;
    --border-color: #c090c0;
    --purple-main: #8a2be2;
    --purple-dark: #4b0082;
    --red-main: #d32f2f;
    --green-main: #2e7d32;
    --text-dark: #212121;
    --text-muted: #666666;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
}

body {
    background-color: var(--bg-color);
    color: var(--text-dark);
    padding: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

h1 {
    color: var(--purple-dark);
    margin-bottom: 15px;
    text-align: center;
    font-size: 1.8rem;
    letter-spacing: 1px;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 8px;
    width: 100%;
    max-width: 1050px;
}

.input-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 18px;
    width: 100%;
    max-width: 1050px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(138, 43, 226, 0.1);
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    align-items: end;
}

.form-group { display: flex; flex-direction: column; gap: 5px; }

label { font-size: 0.88rem; color: var(--purple-dark); font-weight: bold; }

input, select {
    padding: 8px 10px;
    background: #fff;
    border: 1px solid var(--border-color);
    color: var(--text-dark);
    border-radius: 4px;
    font-size: 0.95rem;
    outline: none;
}

input:focus, select:focus {
    border-color: var(--purple-main);
    box-shadow: 0 0 5px rgba(138, 43, 226, 0.3);
}

.btn-group { grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 5px; }

button.btn-submit {
    flex: 2; padding: 12px;
    background: linear-gradient(135deg, #8a2be2, #4b0082);
    color: #fff; border: none; border-radius: 4px;
    font-size: 1.05rem; font-weight: bold; cursor: pointer;
    transition: all 0.3s ease; letter-spacing: 1px;
}
button.btn-submit:hover { background: linear-gradient(135deg, #9932cc, #5a0099); box-shadow: 0 0 10px rgba(138, 43, 226, 0.4); }

button.btn-export {
    flex: 1; padding: 12px;
    background: linear-gradient(135deg, #2e7d32, #1b5e20);
    color: #fff; border: none; border-radius: 4px;
    font-size: 1rem; font-weight: bold; cursor: pointer;
    transition: all 0.3s ease; letter-spacing: 1px;
}
button.btn-export:hover { background: linear-gradient(135deg, #388e3c, #2e7d32); box-shadow: 0 0 10px rgba(46, 125, 50, 0.4); }

.msg { color: var(--red-main); font-size: 0.9rem; grid-column: 1 / -1; text-align: center; }
.hint { grid-column: 1 / -1; font-size: 0.8rem; color: var(--text-muted); text-align: center; line-height: 1.5; }

.chart-container {
    display: none;
    width: 100%;
    max-width: 1050px;
    aspect-ratio: 1.1 / 1;
    background: #ffffff;
    border: 2px solid var(--border-color);
    border-radius: 6px;
    padding: 4px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
}

.grid-board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    width: 100%; height: 100%;
    gap: 2px;
    background: #d8bfd8;
    border: 1px solid #c090c0;
}

.palace-cell {
    grid-row: var(--r);
    grid-column: var(--c);
    background: #ffffff;
    padding: 4px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    font-size: 0.82rem;
    position: relative;
}

.center-cell {
    grid-column: 2 / span 2;
    grid-row: 2 / span 2;
    background: #faf8fc;
    border: 2px solid #c090c0;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: center;
    padding: 15px;
    text-align: center;
}

.center-title { color: var(--purple-main); font-size: 1.6rem; font-weight: bold; letter-spacing: 2px; }
.center-info { font-size: 0.92rem; color: var(--text-dark); line-height: 1.7; }
.center-sihua { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.tag-sihua {
    background: #f0e6fa; border: 1px solid var(--border-color); color: var(--purple-dark);
    padding: 2px 8px; border-radius: 3px; font-size: 0.85rem; font-weight: bold;
}

/* 星曜:左欄(主星+六吉六煞)、右欄(雜曜) */
.star-cols { display: flex; justify-content: space-between; gap: 4px; min-height: 48px; }
.star-col { display: flex; flex-direction: column; gap: 1px; }
.star-col-right { align-items: flex-end; text-align: right; }

.star-item { white-space: nowrap; font-size: 0.82rem; line-height: 1.25; font-weight: bold; }
.star-main { color: #8a2be2; }
.star-good { color: #0066cc; }
.star-bad { color: #cc0000; }
.star-minor { color: #555555; font-weight: normal; font-size: 0.74rem; }
.star-attr { font-size: 0.75rem; font-weight: normal; }
.hua-祿 { color: #2e7d32; font-weight: bold; }
.hua-權 { color: #1565c0; font-weight: bold; }
.hua-科 { color: #ef6c00; font-weight: bold; }
.hua-忌 { color: #d32f2f; font-weight: bold; }

.middle-section { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 2px 0; }
.xusui-list { font-size: 0.72rem; color: #444; text-align: center; line-height: 1.1; letter-spacing: 0.5px; }
.daxian-range { font-size: 0.95rem; font-weight: bold; color: #000; margin-top: 1px; }

.bottom-section { display: flex; flex-direction: column; gap: 2px; margin-top: auto; }
.shensha-top-line, .shensha-bottom-line {
    display: flex; justify-content: space-between; font-size: 0.68rem; padding: 0 1px; line-height: 1.1;
}
.ss-changsheng { color: #d84315; }
.ss-boshi { color: #c2185b; }
.ss-suiqian { color: #2e7d32; }
.ss-jiangqian { color: #1565c0; }

.palace-footer {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 3px;
    border-top: 1px solid #e0c0e0; padding-top: 2px;
}
.palace-name { font-weight: bold; color: #8a2be2; font-size: 0.88rem; }
.is-ming { color: #d32f2f !important; background: #ffebee; padding: 0 3px; border-radius: 2px; }
.gan-zhi { color: #2e7d32; font-size: 0.82rem; font-weight: bold; }
.marks { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; flex: 1; }
.mark { font-size: 0.66rem; color: #fff; background: #9c6ab8; border-radius: 2px; padding: 0 3px; line-height: 1.3; }
.mark-大限 { background: #ad1457; }
.mark-流年 { background: #1565c0; }
.mark-小限 { background: #ef6c00; }


/* ---- 大限宮、流年宮特別標示 ---- */
.palace-cell.is-daxian { box-shadow: inset 0 0 0 3px #ad1457; background: #fff3f8; }
.palace-cell.is-liunian { box-shadow: inset 0 0 0 3px #1565c0; background: #f1f6ff; }
.palace-cell.is-daxian.is-liunian { box-shadow: inset 0 0 0 3px #ad1457, inset 0 0 0 6px #1565c0; background: #f8f2fb; }
.mark-大限, .mark-流年 { font-size: 0.74rem; font-weight: bold; padding: 0 5px; }
.muted { color: var(--text-muted); font-size: 0.82rem; }
.center-info .muted { font-size: 0.8rem; }

/* ---- 命盤解說 ---- */
.reading {
    display: none; width: 100%; max-width: 1050px; margin: 20px 0 30px;
    background: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 18px;
    box-shadow: 0 2px 10px rgba(138, 43, 226, 0.1);
}
.reading h2 { color: var(--purple-dark); font-size: 1.3rem; margin-bottom: 6px; }
.reading h3 { color: var(--purple-main); font-size: 1.05rem; margin: 18px 0 8px; border-left: 4px solid var(--border-color); padding-left: 8px; }
.rd-legend { margin: 10px 0 4px; font-size: 0.85rem; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.rd-summary .sum-item { padding: 8px 10px; margin-bottom: 8px; border-radius: 6px; background: #faf8fc; line-height: 1.7; }

/* 各宮吉凶☆評分(只看本宮星曜、亮度、四化;權重在 reading_data.js) */
(function (root) {
  const ZW = root.ZW;

  ZW.scorePalace = function (cell) {
    const W = ZW.scoreWeights;
    let good = 0, bad = 0;
    const goodSet = new Set(W.goodMinor), badSet = new Set(W.badMinor);

    [...cell.left, ...cell.right].forEach((s) => {
      if (s.kind === "main") {
        const [g, b] = W.mainBright[s.bright] || [0, 0];
        good += g; bad += b;
      } else if (W.goodAux[s.name]) {
        good += W.goodAux[s.name];
      } else if (W.badAux[s.name]) {
        bad += W.badAux[s.name] * (W.badAuxBrightFactor[s.bright] || 1);
      } else if (goodSet.has(s.name)) {
        good += W.minorWeight;
      } else if (badSet.has(s.name)) {
        bad += W.minorWeight;
      }
      if (s.sihua) {
        const [g, b] = W.siHua[s.sihua];
        good += g; bad += b;
      }
    });

    const lv = (x) => Math.max(0, Math.min(W.maxStars, Math.round(x)));
    return { goodScore: good, badScore: bad, goodLevel: lv(good), badLevel: lv(bad) };
  };
})(typeof window !== "undefined" ? window : globalThis);

/* 由命盤資料產生解說結構(不碰 DOM):每宮的宮義、本宮星曜、三方四正、四化 */
(function (root) {
  const ZW = root.ZW;
  const mod = ZW.mod;

  const shortName = (n) => n.replace(/宮$/, "");
  const mainOf = (c) => c.left.filter((s) => s.kind === "main");
  const refOf = (ch, b) => {
    const c = ch.cells[b];
    return { branch: ZW.branches[b], name: c.name, stars: [...c.left, ...c.right].map((s) => s.text), main: mainOf(c).map((s) => s.text) };
  };

  /* 三方四正:本宮、對宮(+6)、兩個三合宮(+4、-4) */
  ZW.sanFangSiZheng = function (ch, b) {
    return {
      self: refOf(ch, b),
      opposite: refOf(ch, mod(b + 6, 12)),
      trines: [refOf(ch, mod(b + 4, 12)), refOf(ch, mod(b - 4, 12))]
    };
  };

  ZW.buildReading = function (ch) {
    const palaces = [];
    for (let k = 0; k < 12; k++) {
      const b = mod(ch.mingIdx - k, 12);
      const c = ch.cells[b];
      const key = shortName(c.name);
      const sf = ZW.sanFangSiZheng(ch, b);
      const mains = mainOf(c);
      const empty = mains.length === 0;
      const oppMains = mainOf(ch.cells[mod(b + 6, 12)]);

      /* 本宮星曜象意(主星 + 六吉六煞 + 祿存天馬) */
      const starNotes = c.left.map((s) => ({
        text: s.text, kind: s.kind,
        meaning: ZW.starMeaning[s.name] || "",
        hua: s.sihua ? `化${s.sihua}:${ZW.siHuaMeaning[s.sihua]}` : ""
      }));

      /* 三方四正內的四化(本宮、對宮、兩三合) */
      const group = [b, mod(b + 6, 12), mod(b + 4, 12), mod(b - 4, 12)];
      const huaInGroup = [];
      group.forEach((gb) => {
        [...ch.cells[gb].left, ...ch.cells[gb].right].forEach((s) => {
          if (s.sihua) huaInGroup.push({ star: s.name, hua: "化" + s.sihua, palace: ch.cells[gb].name, self: gb === b });
        });
      });

      palaces.push({
        branch: b, branchName: ZW.branches[b], name: c.name, stem: c.stem, key,
        meaning: ZW.palaceMeaning[key], isMing: c.isMing, isShen: c.isShen, marks: c.marks.slice(),
        limit: c.limit, empty, borrowed: empty ? oppMains.map((s) => s.text) : [],
        starNotes, sf, huaInGroup, score: ZW.scorePalace(c)
      });
    }

    /* 目前大限 / 流年 / 小限 摘要 */
    const f = ch.flow;
    const summary = { enabled: f.enabled };
    if (f.enabled) {
      summary.year = f.year; summary.yearGZ = ZW.ganZhiOfYear(f.year); summary.age = f.age;
      const pick = (idx) => (idx >= 0 && idx != null ? { branchName: ZW.branches[idx], name: ch.cells[idx].name, sf: ZW.sanFangSiZheng(ch, idx) } : null);
      summary.big = pick(f.bigIdx);
      if (summary.big) summary.big.limit = ch.cells[f.bigIdx].limit;
      summary.small = pick(f.smallIdx);
      summary.liunian = pick(f.yearIdx);
    }
    /* 本命四化:各化星落在哪一宮 */
    const siHua = ch.siHua.map((x) => {
      let where = null;
      ch.cells.forEach((c) => {
        const st = [...c.left, ...c.right].find((q) => q.name === x.star);
        if (st) where = { branchName: ZW.branches[c.branch], palace: c.name, bright: st.bright, isMing: c.isMing };
      });
      const h = x.hua.replace("化", "");
      return { star: x.star, hua: x.hua, h, starMeaning: ZW.starMeaning[x.star] || "", huaMeaning: ZW.siHuaMeaning[h], where };
    });
    return { summary, palaces, siHua };
  };
})(typeof window !== "undefined" ? window : globalThis);

      <p class="muted">宮名旁的 ☆ 是本宮吉凶程度(最多 5 顆,由弱到強):<b class="sc-good">紅色 = 吉</b>、<b class="sc-bad">黑色 = 凶</b>。依本宮星曜、亮度與生年四化加總的簡化估算,權重可在 js/reading_data.js 調整。</p>

    <script>
/* 純文字檔匯出:12 行,一宮一行。
   mode = "full":全部資訊(宮干、星曜、大限、小限、神煞、流運)
   mode = "stars":只存各宮星曜 */
(function (root) {
  const ZW = root.ZW;

  ZW.buildTextExport = function (chart, mode) {
    mode = mode === "stars" ? "stars" : "full";
    const L = [];
    const bar = "=".repeat(80);
    const starsOf = (c) => [...c.left, ...c.right].map((s) => s.text).join(" ");

    L.push(bar);
    if (mode === "stars") {
      L.push(`【${chart.name} 之紫微斗數命盤 — 各宮星曜 (共12宮,一宮一行)】`);
      L.push(`${chart.yinyang} | ${chart.bureauName} | 陰曆生辰: ${chart.lunarText} ${chart.hourName}`);
      L.push(bar);
      chart.cells.forEach((c, b) => {
        const title = c.name + (c.isShen ? "(身宮)" : "");
        L.push(`【${ZW.branches[b]}宮 / ${title}】 星曜: ${starsOf(c)}`);
      });
      return L.join("\n");
    }

    L.push(`【${chart.name} 之紫微斗數純文字命盤 (共12宮,一宮一行全資訊)】`);
    L.push(`性別: ${chart.yinyang} | 局數: ${chart.bureauName} | 陰曆生辰: ${chart.lunarText} ${chart.hourName} | 命宮: ${ZW.branches[chart.mingIdx]} 身宮: ${ZW.branches[chart.shenIdx]} | 命主: ${chart.mingzhu} 身主: ${chart.shenzhu}`);
    if (chart.flow.enabled) L.push(`流運基準: ${chart.flowDate.year}-${chart.flowDate.month}-${chart.flowDate.day} (流年 ${ZW.ganZhiOfYear(chart.flow.year)},虛歲 ${chart.flow.age})`);
    L.push(bar);
    chart.cells.forEach((c, b) => {
      const title = c.name + (c.isShen ? "(身宮)" : "");
      const mk = c.marks.length ? ` | 流運: ${c.marks.join(" ")}` : "";
      L.push(
        `【${ZW.branches[b]}宮 / ${title}】 (宮干:${c.stem}${ZW.branches[b]}) | 星曜: ${starsOf(c)}` +
        ` | 大限: ${c.limit} 歲 | 虛歲: ${c.ages.join(" ")}` +
        ` | 神煞: 長生:${c.ss.cs || ""} 博士:${c.ss.bs || ""} 歲前:${c.ss.sq || ""} 將前:${c.ss.jq || ""}${mk}`
      );
    });
    return L.join("\n");
  };

  ZW.exportFileName = (chart, mode) => `${chart.name}_紫微命盤_${mode === "stars" ? "星曜" : "全資訊"}.txt`;

  /* 手機:跳出系統「分享/儲存到檔案」面板;電腦或不支援時:直接下載。回傳 Promise<"shared"|"downloaded"|"cancelled"> */
  ZW.downloadText = async function (chart, mode) {
    const text = ZW.buildTextExport(chart, mode);
    const name = ZW.exportFileName(chart, mode);
    try {
      if (navigator.canShare && typeof File === "function") {
        const file = new File([text], name, { type: "text/plain" });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: name });
          return "shared";
        }
      }
    } catch (e) {
      if (e && e.name === "AbortError") return "cancelled"; // 使用者自己關掉面板
      /* 其他錯誤:退回下載 */
    }
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return "downloaded";
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
    <script>
/* 離線與安裝:註冊 Service Worker、顯示離線狀態、Android 安裝按鈕、iPhone 加入主畫面提示 */
(function () {
  const ZW = window.ZW || {};
  const info = () => document.getElementById("appInfo");
  const ua = navigator.userAgent || "";
  const isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  let deferredPrompt = null;
  let state = { offline: false, updated: false };

  function render() {
    const el = info();
    if (!el) return;
    const parts = [`版本 ${ZW.VERSION || "?"}`];
    if (location.protocol === "file:") parts.push("本機檔案模式(不需網路;無法加入主畫面)");
    else if (state.offline) parts.push('<span class="ok">已可離線使用 ✓</span>');
    else if ("serviceWorker" in navigator) parts.push("首次載入中…完成後即可離線使用");
    else parts.push("此瀏覽器不支援離線快取");
    if (state.updated) parts.push("已下載新版,關閉後重新開啟即生效");
    let html = parts.join(" · ");
    if (deferredPrompt) html += ' <button type="button" id="btnInstall">安裝到手機</button>';
    else if (isIOS && !standalone && location.protocol !== "file:") html += "<br>iPhone:用 Safari 開啟,點下方「分享」→「加入主畫面」即可像 App 一樣使用";
    el.innerHTML = html;
    const b = document.getElementById("btnInstall");
    if (b) b.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice.catch(() => {});
      deferredPrompt = null;
      render();
    });
  }

  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; render(); });
  window.addEventListener("appinstalled", () => { deferredPrompt = null; render(); });

  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").then((reg) => {
      reg.addEventListener("updatefound", () => {
        const w = reg.installing;
        if (w) w.addEventListener("statechange", () => { if (w.state === "installed" && hadController) { state.updated = true; render(); } });
      });
    }).catch(() => {});
    navigator.serviceWorker.ready.then(() => { state.offline = true; render(); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", render); else render();
})();

</script>
    <script>
/* 表單互動:下拉選單、曆法切換、排盤、匯出 */
(function () {
  const ZW = window.ZW;
  const $ = (id) => document.getElementById(id);
  let lastChart = null;

  /* 填入選項;selected 不存在時依序嘗試「去掉閏月標記」、第一項 */
  function fill(sel, items, selected) {
    sel.innerHTML = "";
    items.forEach((it) => {
      const o = document.createElement("option");
      o.value = String(it.value);
      o.textContent = it.text;
      sel.appendChild(o);
    });
    const values = items.map((i) => String(i.value));
    const s = selected === undefined ? "" : String(selected);
    if (values.includes(s)) sel.value = s;
    else if (values.includes(String(parseInt(s, 10)))) sel.value = String(parseInt(s, 10));
    else if (items.length) sel.value = values[0];
  }

  const isLunar = () => $("calType").value === "lunar";
  const parseMonth = (v) => ({ m: parseInt(v, 10), leap: String(v).endsWith("L") });
  const monthValue = (m, leap) => (leap ? m + "L" : String(m));

  function initYear(sel) {
    const items = [];
    for (let y = ZW.MIN_YEAR; y <= ZW.MAX_YEAR; y++) items.push({ value: y, text: `${y} 年 (${ZW.ganZhiOfYear(y)}年)` });
    fill($("birthYear"), items, sel);
  }
  function initMonth(sel) {
    const y = parseInt($("birthYear").value, 10), items = [];
    if (isLunar()) ZW.lunarMonthList(y).forEach((it) => items.push({ value: monthValue(it.m, it.leap), text: it.leap ? `閏 ${it.m} 月` : `${it.m} 月` }));
    else for (let m = 1; m <= 12; m++) items.push({ value: m, text: `${m} 月` });
    fill($("birthMonth"), items, sel);
  }
  function initDay(sel) {
    const y = parseInt($("birthYear").value, 10), { m, leap } = parseMonth($("birthMonth").value);
    const n = isLunar() ? ZW.lunarMonthDays(y, m, leap) : ZW.solarMonthDays(y, m), items = [];
    for (let d = 1; d <= n; d++) items.push({ value: d, text: `${d} 日` });
    let s = parseInt(sel, 10);
    if (!(s >= 1)) s = 1;
    fill($("birthDay"), items, Math.min(s, n));
  }
  function initShichen(sel) { fill($("birthShichen"), ZW.shichenLabels.map((x) => ({ value: x.value, text: x.text })), sel); }

  /* 切換曆法時把目前日期換算成另一種曆法 */
  function onCalTypeChange() {
    const y = parseInt($("birthYear").value, 10), { m, leap } = parseMonth($("birthMonth").value), d = parseInt($("birthDay").value, 10);
    let ty = y, tm = m, tl = false, td = d;
    if (isLunar()) { // 國曆 → 農曆
      const l = ZW.solarToLunar(y, m, d);
      if (l) { ty = l.year; tm = l.month; tl = l.leap; td = l.day; }
    } else { // 農曆 → 國曆
      const s = ZW.lunarToSolar(y, m, leap, d);
      if (s) { ty = s.year; tm = s.month; td = s.day; }
    }
    initYear(ty); initMonth(monthValue(tm, tl)); initDay(td);
    $("msg").textContent = "";
  }

  function todayParts() {
    const t = new Date();
    return { year: t.getFullYear(), month: t.getMonth() + 1, day: t.getDate() };
  }
  const pad = (n) => String(n).padStart(2, "0");

  function readOptions() {
    const { m, leap } = parseMonth($("birthMonth").value);
    const sc = $("birthShichen").value;
    let flowDate = null;
    const fv = $("flowDate").value; // yyyy-mm-dd
    if (fv) { const p = fv.split("-").map(Number); flowDate = { year: p[0], month: p[1], day: p[2] }; }
    return {
      name: $("userName").value.trim() || "命主",
      gender: $("gender").value,
      calType: $("calType").value,
      year: parseInt($("birthYear").value, 10),
      month: m, leap,
      day: parseInt($("birthDay").value, 10),
      hour: sc === "L" ? 0 : parseInt(sc, 10), // 注意:子時 = 0,不可用 || 取預設值
      lateZi: sc === "L",
      minorBright: $("minorBright").checked,
      flowDate
    };
  }

  function generate() {
    $("msg").textContent = "";
    try {
      lastChart = ZW.computeChart(readOptions());
    } catch (e) {
      $("msg").textContent = e.message;
      return null;
    }
    ZW.renderChart(lastChart, $("gridBoard"));
    ZW.renderReading(lastChart, $("reading"));
    const box = $("chartContainer");
    box.style.display = "block";
    if (box.scrollIntoView) box.scrollIntoView({ behavior: "smooth" });
    return lastChart;
  }

  function setup() {
    const t = todayParts();
    $("flowDate").value = `${t.year}-${pad(t.month)}-${pad(t.day)}`;
    // 預設帶入「科技紫微網」範例盤(1981/5/28 子時 男),方便對照
    initYear(1981); initMonth(5); initDay(28); initShichen("0");
    $("calType").addEventListener("change", onCalTypeChange);
    $("birthYear").addEventListener("change", () => { const m = $("birthMonth").value, d = $("birthDay").value; initMonth(m); initDay(d); });
    $("birthMonth").addEventListener("change", () => initDay($("birthDay").value));
    $("ziweiForm").addEventListener("submit", (e) => { e.preventDefault(); generate(); });
    $("btnExport").addEventListener("click", () => {
      const c = generate();
      if (c) ZW.downloadText(c, $("exportMode").value);
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", setup);
  else setup();
})();

</script>

<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>籤詩轉檔</title>
<style>body{font-family:"Microsoft JhengHei",sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.8;background:#fbf5e6;color:#2b1b14}
button,input{font:inherit}button{padding:8px 20px;background:#a8261b;color:#fff;border:0;border-radius:4px;cursor:pointer}#msg{margin-top:14px;font-weight:700}</style></head>
<body>
<h1>籤詩轉檔</h1>
<p>把 <b>poems</b> 資料夾內的 001.json … 100.json 合併成一個 <b>poems.js</b>,存回 poems 資料夾,雙擊 index.html 就讀得到解籤內容。新增或修改 JSON 後重做一次即可。</p>
<p>籤種代號:<input id="sid" value="fs100" size="10"></p>
<p><button id="pick">選擇 poems 資料夾</button> <input type="file" id="dir" webkitdirectory multiple hidden></p>
<p id="msg"></p>
<script>
document.getElementById('pick').onclick = () => document.getElementById('dir').click();
document.getElementById('dir').onchange = async (ev) => {
  const sid = document.getElementById('sid').value.trim() || 'fs100', store = {}, msg = document.getElementById('msg');
  for (const f of Array.from(ev.target.files)) {
    const m = /(?:^|[\\/])(\d{1,3})\.json$/i.exec(f.webkitRelativePath || f.name);
    if (!m) continue;
    try { store[sid + ':' + Number(m[1])] = JSON.parse((await f.text()).replace(/^﻿/, '')); } catch (e) {}
  }
  const n = Object.keys(store).length;
  if (!n) { msg.textContent = '資料夾裡沒有 001.json 這類檔案。'; return; }
  const js = '/* 籤詩資料(由 poems 資料夾內的 NNN.json 合併而成)。更新 JSON 後,請用「轉檔.html」重新產生本檔。 */\n' +
    'window.QQ=window.QQ||{};QQ.poemStore=QQ.poemStore||{};\nObject.assign(QQ.poemStore,' + JSON.stringify(store) + ');\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }));
  a.download = 'poems.js'; a.click();
  msg.textContent = `已轉出 ${n} 首,請把下載的 poems.js 放進 poems 資料夾(覆蓋舊檔)。`;
};
</script></body></html>
